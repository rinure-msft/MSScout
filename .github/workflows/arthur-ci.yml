name: Arthur CI

on:
  push:
    paths:
      - "arthur-scout/**"
      - "arthur-desktop/**"
      - "LICENSE"
      - ".github/workflows/arthur-ci.yml"
  pull_request:
    paths:
      - "arthur-scout/**"
      - "arthur-desktop/**"
      - "LICENSE"
      - ".github/workflows/arthur-ci.yml"

permissions:
  contents: read

jobs:
  arthur-package:
    name: Validate Arthur package
    runs-on: ubuntu-latest
    env:
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev espeak ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r arthur-scout/requirements-ci.txt

      - name: Compile Arthur Python modules
        run: python -m py_compile arthur-scout/src/*.py

      - name: Run Arthur Python tests
        run: python -m unittest discover -s arthur-scout/tests -v

      - name: Run no-side-effect command smoke tests
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'arthur_voice_command_smoke_test.json'
          python arthur-scout/src/arthur_voice_bridge.py --smoke-test-commands | Set-Content -Path $out -Encoding UTF8
          $raw = Get-Content $out -Raw
          $start = $raw.IndexOf('{')
          if ($start -lt 0) {
            throw "No JSON object found in smoke-test output."
          }
          $json = $raw.Substring($start)
          Set-Content -Path $out -Value $json -Encoding UTF8
          $result = $json | ConvertFrom-Json
          "Smoke status=$($result.status) commands=$($result.commands) aliases=$($result.aliases) alias_failures=$($result.alias_failures.Count) handler_failures=$($result.handler_failures.Count)"
          if ($result.status -ne 'passed') {
            throw "Arthur command smoke tests failed."
          }

      - name: Validate package files and templates
        shell: pwsh
        run: pwsh -NoProfile -File arthur-scout/scripts/Test-Arthur.ps1 -PackageRoot arthur-scout

      - name: Validate package export
        shell: pwsh
        run: |
          $liveSource = Join-Path $env:RUNNER_TEMP 'arthur-live-source'
          $exportRoot = Join-Path $env:RUNNER_TEMP 'arthur-exported'
          New-Item -ItemType Directory -Path $liveSource -Force | Out-Null
          Copy-Item -LiteralPath 'arthur-scout/scripts/Start-Arthur.ps1' -Destination $liveSource -Force
          Copy-Item -LiteralPath 'arthur-scout/scripts/Update-Arthur.ps1' -Destination $liveSource -Force
          Copy-Item -LiteralPath 'arthur-scout/config/automations.template.json' -Destination (Join-Path $liveSource 'automations.template.json') -Force
          Copy-Item -Path 'arthur-scout/src/*.py' -Destination $liveSource -Force
          pwsh -NoProfile -File arthur-scout/scripts/Export-ArthurPackage.ps1 -SourceRoot $liveSource -OutputRoot $exportRoot
          pwsh -NoProfile -File (Join-Path $exportRoot 'arthur-scout/scripts/Test-Arthur.ps1') -PackageRoot (Join-Path $exportRoot 'arthur-scout')

      - name: Generate dashboard snapshot
        run: python arthur-scout/src/arthur_status_dashboard.py --output "${RUNNER_TEMP}/arthur_status_dashboard.html"

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arthur-ci-artifacts
          path: |
            ${{ runner.temp }}/arthur_voice_command_smoke_test.json
            ${{ runner.temp }}/arthur_status_dashboard.html
          if-no-files-found: ignore

  arthur-desktop:
    name: Validate Windows desktop
    runs-on: windows-latest
    defaults:
      run:
        working-directory: arthur-desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: arthur-desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Validate desktop source
        run: |
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm run lint
          npm test

      - name: Test v0.3 runtime upgrade
        shell: pwsh
        run: pwsh -NoProfile -File ..\arthur-scout\tests\Test-ArthurUpgrade.ps1

      - name: Build and verify desktop
        shell: pwsh
        run: |
          npm run runtime:build
          npm run build
          npm run verify:package
          npm run test:tray-native
          pwsh -NoProfile -File scripts/package.ps1 -Target nsis -OutputRoot (Join-Path $env:RUNNER_TEMP 'arthur-desktop')

      - name: Upload unsigned CI installer
        uses: actions/upload-artifact@v4
        with:
          name: arthur-desktop-unsigned-ci
          path: ${{ runner.temp }}/arthur-desktop/Arthur-Setup-*.exe
          if-no-files-found: error
