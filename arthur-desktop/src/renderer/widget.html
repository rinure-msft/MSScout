<!doctype html>
<html lang="en">
<head>
  <script>
    (() => {
      const theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Arthur</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./widget.css">
</head>
<body>
  <div id="widget-shell" class="widget-shell" data-tone="stopped" data-glow="false">
    <span class="widget-glow" aria-hidden="true"></span>
    <div class="widget-surface">
      <span class="widget-grabber" aria-hidden="true"></span>
      <button id="widget-listen" class="widget-state" type="button" data-icon="play" aria-label="Start listening"></button>
      <button id="widget-open" class="widget-open" type="button" data-icon="system" aria-label="Open Arthur controls"></button>
    </div>
  </div>
  <script type="module" src="./widget.ts"></script>
</body>
</html>
